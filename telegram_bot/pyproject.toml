[project]
name = "carcara-telegram-bot"
version = "0.1.0"
description = "Telegram bot that wraps the Carcará (Kimi Code CLI) agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21.0",
    "kimi-cli",
    "vosk>=0.3.45",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
kimi-cli = { path = "../" }

[project.scripts]
carcara-bot = "telegram_bot.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
